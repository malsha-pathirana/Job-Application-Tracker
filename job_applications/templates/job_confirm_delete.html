{% extends 'base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; text-align: center;" class="card">
    <h2 style="color: #e74c3c; margin-bottom: 15px;">Confirm Delete</h2>
    <p style="margin-bottom: 25px; font-size: 1.1rem;">
        Are you sure you want to delete the job application for
        <strong>{{ job.job_position }}</strong> at <strong>{{ job.company_name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}
        <div style="display: flex; justify-content: center; gap: 15px;">
            <a href="{% url 'job_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </div>
    </form>
</div>
{% endblock %}
