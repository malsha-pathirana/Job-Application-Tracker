<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Job Application Tracker</title>
<style>
        * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI',
        Tahoma, sans-serif;
        }
        body {
        background-color: #f4f6f9;
        color: #333;
        }
        .navbar {
        background-color: #1a252f;
        color: #fff;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        }
        .navbar a {
        color: #fff;
        text-decoration: none;
        font-size: 1.2rem;
        font-weight: bold;
        }
        .container {
        max-width: 1000px;
        margin: 30px auto;
        padding: 0 20px;
        }
        .btn {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 4px;
        text-decoration: none;
        font-size: 0.9rem;
        border: none;
        cursor: pointer;
        }
        .btn-primary {
        background-color: #3498db;
        color: #fff;
        }
        .btn-success {
        background-color: #2ecc71;
        color: #fff;
        }
        .btn-warning {
        background-color: #f1c40f;
        color: #fff;
        }
        .btn-danger {
        background-color: #e74c3c;
        color: #fff;
        }
        .btn-secondary {
        background-color: #95a5a6;
        color: #fff;
        }
        .badge {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.8rem;
        font-weight: bold;
        color: white;
        display: inline-block;
        }
        .badge-applied {
        background-color: #3498db;
        }
        .badge-interview {
        background-color: #f39c12;
        }
        .badge-selected {
        background-color: #2ecc71;
        }
        .badge-rejected {
        background-color: #e74c3c;
        }
        .form-group {
        margin-bottom: 15px;
        }
        .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        }
        .form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
        }
        .card {
        background-color: #fff;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>

</head>
<body>
<nav class="navbar">
    <a href="{% url 'job_list' %}">Job Application Tracker</a>
    <a href="{% url 'add_job' %}" class="btn btn-success">Add New Job</a>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
